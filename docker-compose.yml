services:
  fx42:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
      - ./config:/config:ro
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  litestream:
    image: litestream/litestream:0.5
    command: replicate
    volumes:
      - ./data:/data
      - ./backup:/backup
      - ./docker/litestream.yml:/etc/litestream.yml:ro
    restart: unless-stopped
