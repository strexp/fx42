<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0f14" />
    <title>FX42 · Offline</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0f14;
        color: #e5e7eb;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 4px 0;
        color: #94a3b8;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <img src="/icons/icon-192.png" alt="" width="72" height="72" />
        <h1>You are offline</h1>
        <p>Check your connection and try again.</p>
        <p>当前处于离线状态，请检查网络后重试。</p>
      </div>
    </main>
  </body>
</html>
